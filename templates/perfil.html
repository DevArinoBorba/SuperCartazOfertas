{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Meu Perfil</h1>
    <a href="javascript:history.back()" class="btn-sm btn-secondary">← Voltar</a>
</div>

<div class="form-card">
    <h3>Informações da Conta</h3>
    <div class="info-grid">
        <div>
            <label style="font-size:0.78rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);">Usuário</label>
            <p style="font-size:1.1rem;font-weight:700;color:var(--gold-light);">{{ session.get('username') }}</p>
        </div>
        <div>
            <label style="font-size:0.78rem;font-weight:600;text-transform:uppercase;color:var(--text-muted);">Perfil</label>
            <p style="font-size:1.1rem;font-weight:700;">
                {% if session.get('role') == 'admin' %}
                    <span class="badge-admin">Admin</span>
                {% else %}
                    <span class="badge-filial">Filial</span>
                {% endif %}
            </p>
        </div>
    </div>

    <hr class="gold-divider">

    <h3>🔑 Alterar Minha Senha</h3>
    <form method="POST" action="{{ url_for('perfil') }}">
        <div class="form-grid grid-profile-password">
            <div class="form-group">
                <label for="senha_atual">Senha Atual</label>
                <div class="password-wrapper">
                    <input type="password" id="senha_atual" name="senha_atual" required placeholder="••••••">
                    <button type="button" class="password-toggle" onclick="toggleSenha('senha_atual', this)" tabindex="-1">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="nova_senha">Nova Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="nova_senha" name="nova_senha" required placeholder="mín. 4 caracteres" minlength="4">
                    <button type="button" class="password-toggle" onclick="toggleSenha('nova_senha', this)" tabindex="-1">👁️</button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirmar_senha">Confirmar Nova Senha</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmar_senha" name="confirmar_senha" required placeholder="repita a senha" minlength="4">
                    <button type="button" class="password-toggle" onclick="toggleSenha('confirmar_senha', this)" tabindex="-1">👁️</button>
                </div>
            </div>
            <div class="form-group" style="justify-content:flex-end;">
                <button type="submit" class="btn-primary" style="margin-top:0;padding:0.7rem 1.5rem;">💾 Alterar</button>
            </div>
        </div>
    </form>
</div>

<script>
function toggleSenha(id, btn) {
    var el = document.getElementById(id);
    if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = '🙈';
    } else {
        el.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
